function legend(series){return `<div class="legend">${series.map((s,i)=>`<span><i style="background:${s.color||C[i%C.length]}"></i>${esc(s.name)}</span>`).join('')}</div>`}
let CHART_PANEL_SEQ=0,ACTIVE_CHART_PANEL='';
function nextChartPanel(){ACTIVE_CHART_PANEL=`chartInfo${++CHART_PANEL_SEQ}`;return ACTIVE_CHART_PANEL}
function tipAttr(title,detail,panelId=ACTIVE_CHART_PANEL,seriesKey=""){return `tabindex="0" role="button" aria-pressed="false" data-panel-id="${esc(panelId)}" data-series-key="${esc(seriesKey)}" data-tip-title="${esc(title)}" data-tip-detail="${esc(detail)}"`}
function chartPanel(id,message='그래프 항목을 선택하면 항목 설명과 수치가 표시됩니다.'){return `<div class="chart-selection" id="${id}" data-default-message="${esc(message)}" aria-live="polite"><span class="selection-label">선택 상태</span><span class="selection-title">${esc(message)}</span><span class="selection-label">수치 정보</span><span class="selection-detail">항목을 클릭해 주세요.</span></div>`}
function groupedChart(categories,series,opt={}){const panelId=nextChartPanel(),W=opt.width||920,H=opt.height||330,L=66,R=18,T=22,B=72,iw=W-L-R,ih=H-T-B;const max=opt.max||Math.max(1,...series.flatMap(s=>s.values));const slot=iw/categories.length,groupW=slot*.72,bw=Math.max(2,groupW/series.length);let g='';for(let i=0;i<=5;i++){let y=T+ih-i*ih/5,v=max*i/5;g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e9e3e7"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#776f74">${opt.percent?v.toFixed(0)+'%':fmt(v)}</text>`}categories.forEach((cat,ci)=>{let x0=L+slot*ci+(slot-groupW)/2;if(opt.weekend&&opt.weekend[ci])g+=`<rect x="${L+slot*ci+2}" y="${T}" width="${slot-4}" height="${ih}" rx="6" fill="#fff2f8" stroke="#e6007e" stroke-dasharray="4 3"/>`;series.forEach((sr,si)=>{let v=Number(sr.values[ci]||0),plotV=Math.min(v,max),h=plotV/max*ih,x=x0+si*bw,y=T+ih-h,detail=`구분: ${sr.name} · ${opt.percent?'구성비: '+v.toFixed(1)+'%':'실제 수치: '+fmt(v)}`;g+=`<rect ${tipAttr(cat,detail,panelId,sr.name)} x="${x}" y="${y}" width="${Math.max(1,bw-2)}" height="${h}" rx="2" fill="${sr.color||C[si%C.length]}"/>${v>max?`<text x="${x+Math.max(1,bw-2)/2}" y="${T+12}" text-anchor="middle" font-size="11" font-weight="900" fill="#c73e54">▲</text>`:''}`});let label=esc(cat),rot=categories.length>7?-38:0,x=L+slot*(ci+.5),y=H-B+18;g+=`<text x="${x}" y="${y}" text-anchor="${rot?'end':'middle'}" transform="rotate(${rot} ${x} ${y})" font-size="10" fill="#5e565b">${label}</text>`});return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'막대그래프')}">${g}</svg></div>${chartPanel(panelId)}${legend(series)}`}
function stacked100(categories,segments,opt={}){const panelId=nextChartPanel(),W=920,H=300,L=80,R=25,T=26,B=55,iw=W-L-R,ih=H-T-B,slot=iw/categories.length,bw=Math.min(92,slot*.55);let g='';for(let i=0;i<=4;i++){let y=T+ih-i*ih/4;g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e9e3e7"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#776f74">${i*25}%</text>`}categories.forEach((cat,ci)=>{let total=sum(segments.map(x=>x.values[ci])),base=T+ih,x=L+slot*(ci+.5)-bw/2;segments.forEach((sr,si)=>{let raw=Number(sr.values[ci]||0),p=share(raw,total),h=p/100*ih;base-=h;g+=`<rect ${tipAttr(cat,`구분: ${sr.name} · 실제 수치: ${fmt(raw)} · 구성비: ${p.toFixed(1)}%`,panelId,sr.name)} x="${x}" y="${base}" width="${bw}" height="${h}" fill="${sr.color||C[si%C.length]}"/>`});g+=`<text x="${x+bw/2}" y="${H-B+19}" text-anchor="middle" font-size="11" font-weight="700">${esc(cat)}</text>`});return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>${chartPanel(panelId)}${legend(segments)}`}
function hGrouped(categories,series,opt={}){const panelId=nextChartPanel(),W=930,L=150,R=55,T=28,B=30,row=36,H=T+B+categories.length*row,iw=W-L-R,max=opt.max||Math.max(1,...series.flatMap(s=>s.values));let g='';categories.forEach((cat,ci)=>{let gy=T+ci*row,bh=Math.min(10,22/series.length);g+=`<text x="${L-8}" y="${gy+14}" text-anchor="end" font-size="10" fill="#5d555a">${esc(cat)}</text>`;series.forEach((sr,si)=>{let v=Number(sr.values[ci]||0),y=gy+si*(bh+2),w=v/max*iw,display=opt.percent?v.toFixed(1)+'%':fmt(v);g+=`<rect ${tipAttr(cat,`구분: ${sr.name} · ${opt.percent?'구성비: '+v.toFixed(1)+'%':'실제 수치: '+fmt(v)}`,panelId,sr.name)} x="${L}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${sr.color||C[si%C.length]}"/><text x="${L+w+5}" y="${y+bh-1}" font-size="9" fill="#665e63">${display}</text>`})});return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>${chartPanel(panelId)}${legend(series)}`}
function lineChart(categories,series,opt={}){const panelId=nextChartPanel(),W=920,H=320,L=66,R=25,T=28,B=60,iw=W-L-R,ih=H-T-B,max=opt.max||Math.max(1,...series.flatMap(s=>s.values));let g='';for(let i=0;i<=5;i++){let y=T+ih-i*ih/5,v=max*i/5;g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e9e3e7"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#776f74">${opt.percent?v.toFixed(0)+'%':fmt(v)}</text>`}series.forEach((sr,si)=>{let pts=sr.values.map((v,i)=>`${L+(categories.length===1?iw/2:i*iw/(categories.length-1))},${T+ih-v/max*ih}`).join(' ');g+=`<polyline class="series-line" data-panel-id="${esc(panelId)}" data-series-key="${esc(sr.name)}" points="${pts}" fill="none" stroke="${sr.color||C[si%C.length]}" stroke-width="3" pointer-events="none"/>`;for(let i=0;i<sr.values.length-1;i++){const x1=L+(categories.length===1?iw/2:i*iw/(categories.length-1)),y1=T+ih-sr.values[i]/max*ih,x2=L+(i+1)*iw/(categories.length-1),y2=T+ih-sr.values[i+1]/max*ih,d1=opt.percent?Number(sr.values[i]).toFixed(1)+'%':fmt(sr.values[i]),d2=opt.percent?Number(sr.values[i+1]).toFixed(1)+'%':fmt(sr.values[i+1]);g+=`<line class="line-hit" ${tipAttr(`${categories[i]} → ${categories[i+1]}`,`구분: ${sr.name} · 시작 수치: ${d1} · 종료 수치: ${d2}`,panelId,sr.name)} x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="14"/>`}sr.values.forEach((v,i)=>{let x=L+(categories.length===1?iw/2:i*iw/(categories.length-1)),y=T+ih-v/max*ih;g+=`<circle ${tipAttr(categories[i],`구분: ${sr.name} · ${opt.percent?'구성비: '+Number(v).toFixed(1)+'%':'실제 수치: '+fmt(v)}`,panelId,sr.name)} cx="${x}" cy="${y}" r="6" fill="${sr.color||C[si%C.length]}" stroke="#fff" stroke-width="2"/>`})});categories.forEach((x,i)=>{let px=L+(categories.length===1?iw/2:i*iw/(categories.length-1));g+=`<text x="${px}" y="${H-B+20}" text-anchor="middle" font-size="10">${esc(x)}</text>`});return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>${chartPanel(panelId)}${legend(series)}`}
function genderAgePyramid(d,ys){const panelId=nextChartPanel(),W=980,CX=490,GAP=104,L=45,R=45,T=58,B=46,rowH=54,H=T+B+AGE.length*rowH,half=CX-GAP/2-L,all=[];ys.forEach(y=>{const dm=d.demographics[y],total=sum(dm.gender.map(x=>x.value));AGE.forEach(a=>{all.push(share(rowMap(dm.genderAge.M)[a]?.value||0,total),share(rowMap(dm.genderAge.F)[a]?.value||0,total))})});const max=Math.max(1,...all),bw=Math.min(11,30/ys.length),groupH=ys.length*(bw+2);let g=`<text x="${CX-GAP/2-half/2}" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#176B8C">남성</text><text x="${CX+GAP/2+half/2}" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#ED3B9A">여성</text><line x1="${CX}" y1="${T-18}" x2="${CX}" y2="${H-B+5}" stroke="#d7d0d5"/>`;AGE.forEach((a,ai)=>{const cy=T+ai*rowH+rowH/2;g+=`<text x="${CX}" y="${cy+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#4f484d">${esc(a)}</text>`;ys.forEach((y,yi)=>{const dm=d.demographics[y],total=sum(dm.gender.map(x=>x.value)),mv=rowMap(dm.genderAge.M)[a]?.value||0,fv=rowMap(dm.genderAge.F)[a]?.value||0,mp=share(mv,total),fp=share(fv,total),mw=mp/max*half,fw=fp/max*half,yy=cy-groupH/2+yi*(bw+2);g+=`<rect ${tipAttr(`${y}년 남성 · ${a}`,`구분: 남성 · 실제 수치: ${fmt(mv)}명 · 구성비: ${mp.toFixed(1)}%`,panelId,`${y}년`)} x="${CX-GAP/2-mw}" y="${yy}" width="${mw}" height="${bw}" rx="2" fill="${yearColor(y)}"/><rect ${tipAttr(`${y}년 여성 · ${a}`,`구분: 여성 · 실제 수치: ${fmt(fv)}명 · 구성비: ${fp.toFixed(1)}%`,panelId,`${y}년`)} x="${CX+GAP/2}" y="${yy}" width="${fw}" height="${bw}" rx="2" fill="${yearColor(y)}"/>`})});return `<div class="card"><div class="pyramid-chart chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="연도별 성별 연령별 비교 그래프">${g}</svg></div>${chartPanel(panelId,'막대를 선택하면 연도·성별·연령별 구성비와 인원이 표시됩니다.')}<div class="pyramid-legend"><span><i style="background:#176B8C"></i>남성(좌)</span><span><i style="background:#ED3B9A"></i>여성(우)</span></div>${legend(ys.map(y=>({name:y+'년',color:yearColor(y)})))}</div>`}
function page(id,no,title,lead,body){return `<section class="page" id="${id}" data-page="${id}"><div class="page-head"><span class="secno">${no}</span><h3>${title}</h3></div><p class="lead">${lead}</p>${body}</section>`}

function selectedYears(d){if(state.year==='all')return d.years;if(state.year==='compare2526')return d.years.filter(y=>y===2025||y===2026);const cutoff=Number(state.year);return d.years.filter(y=>Number(y)<=cutoff)}
function focusYear(d){return state.year==='all'||state.year==='compare2526'?Math.max(...d.years):Number(state.year)}
let state={festival:'ace',year:'all'};
const WEEK=['월','화','수','목','금','토','일'];
function render(){resetChartSelections();const d=DATA.festivals[state.festival];applyForeignFromSource(d);const ys=selectedYears(d),fy=focusYear(d);updateReportHeading(d);document.getElementById('report').innerHTML=cover(d,fy)+tocPage()+section1(d,ys)+section2(d,ys)+section3(d,ys)+section4(d,ys)+section5(d,ys)+section6(d,ys)+section7(d,ys)+methodPage(d);buildFestivalTabs();bindTocNavigation();bindChartTips();document.getElementById('report').scrollTo({top:0,behavior:'smooth'});}
function cover(d,fy){const total=d.annualVisits[fy],prev=d.annualVisits[fy-1],yoy=prev?(total/prev-1)*100:null,foreign=d.foreignAnnual[fy],lod=d.lodgingRuleAnnual[fy]?.total||0;return `<section class="page cover" id="cover"><div class="eyebrow">NORMALIZED SOURCE DATA · INTERACTIVE REPORT</div><h2>${esc(festivalReportTitle(d))}<br>통합 비교 분석</h2><p>7개 분석 영역과 19개 세부 목차로 구성했습니다. 축제 탭과 연도 조건을 바꾸면 연도 비교 표·그래프가 갱신되며, 2026년 지정 분석은 동일하게 유지됩니다.</p><div class="kpis"><div class="kpi"><b>${fmt(total)}명</b><span>${fy} 방문자수</span></div><div class="kpi"><b>${yoy==null?'비교 없음':(yoy>=0?'+':'')+yoy.toFixed(1)+'%'}</b><span>전년 대비</span></div><div class="kpi"><b>${fmt(foreign)}명</b><span>외국인 방문자</span></div><div class="kpi"><b>${fmt(lod)}명·일</b><span>지역 제외 기준 적용 숙박인구</span></div></div>${coverMetaBlock(d)}</section>`}
function tocPage(){const groups=[['1','전체 방문자 비교',['1.1 연도별 방문자 비교','1.2 일자별 방문자 비교','1.3 요일별 방문자 비교']],['2','외국인 방문자 비교',[]],['3','성·연령별 비교',['3.1 연도별×성별 비교','3.2 연도별×연령별 비교','3.3 연도별×성×연령별 비교','3.4 26년 일자별×연령별 비교']],['4','가구유형별 비교',['4.1 연도별×가구유형별 비교','4.2 26년 주중/주말×가구유형별 비교','4.3 26년 주중/주말×키즈맘 유형별 비교']],['5','거주지별 비교',['5.1 거주지 TOP10 시도 연도별 비교(행사 시도 제외)','5.2 거주지 TOP20 시군구 연도별 비교(행사 시도 제외)']],['6','유입/체류인구 비교',['6.1 26년 시간대별 유입인구/체류인구 분석','6.2 26년 주중/주말 시간대별 유입인구/체류인구 분석','6.3 연도별 시간대별 체류시간 분석']],['7','숙박인구 비교',['7.1 연도별 숙박자 비중 및 숙박일수 비중','7.2 연도별 숙박자 성·연령 비교','7.3 연도별 숙박자 거주시도 비교']]];return `<section class="page toc" id="toc"><div class="page-head"><span class="secno">목차</span><h3>분석 목차</h3></div><div class="year-key"><b>연도 공통 색상</b><span><i style="background:${yearColor(2024)}"></i>2024년</span><span><i style="background:${yearColor(2025)}"></i>2025년</span><span><i style="background:${yearColor(2026)}"></i>2026년</span></div><div class="toc-grid">${groups.map(g=>`<article class="toc-item"><a class="toc-main-link" href="#section${g[0]}">${g[0]}. ${g[1]}</a>${g[2].map(x=>`<span class="toc-sub-link">${x}</span>`).join('')}</article>`).join('')}</div></section>`}

function subhead(no,title,desc='',action=''){const sid='sub-'+String(no).replace(/[^0-9]+/g,'-').replace(/^-|-$/g,'');return `<div class="subhead" id="${sid}"><b>${no}</b><div><h4>${title}</h4>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}
function togglePair(simpleId,detailId,btn,simpleText='상세보기',detailText='간단히 보기'){resetChartSelections();const a=document.getElementById(simpleId),b=document.getElementById(detailId),showDetail=b.classList.contains('hidden');a.classList.toggle('hidden',showDetail);b.classList.toggle('hidden',!showDetail);btn.textContent=showDetail?detailText:simpleText}
function topLabelsAcross(years,getter,limit){const t={};years.forEach(y=>(getter(y)||[]).forEach(x=>t[x.label]=(t[x.label]||0)+x.value));return Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(x=>x[0])}
function section1(d,ys){const annual=ys.map(y=>d.annualVisits[y]||0);const dailyCats=Array.from({length:Math.max(...ys.map(y=>(d.dailyOrdinal[y]||[]).length))},(_,i)=>`D${i+1}`);const dailySeries=ys.map((y,i)=>({name:y+'년',color:yearColor(y),values:dailyCats.map((_,j)=>d.dailyOrdinal[y]?.[j]?.value||0)}));const weekdaySeries=ys.map((y,i)=>({name:y+'년',color:yearColor(y),values:WEEK.map(w=>rowMap(d.weekdayVisits[y])[w]?.value||0)}));const dailyRows=dailyCats.map((x,i)=>[x,...ys.map(y=>{const z=d.dailyOrdinal[y]?.[i];return z?`${z.date.slice(5)}(${z.weekday}) ${fmt(z.value)}`:'–'})]);return page('section1','1','전체 방문자 비교','DB1 방문자수를 연도·행사일 순번·요일 기준으로 비교합니다.',`${subhead('1.1','연도별 방문자 비교')}<div class="grid2"><div class="card">${groupedChart(['방문자수'],ys.map((y,i)=>({name:y+'년',color:yearColor(y),values:[annual[i]]})))}</div><div>${table(['연도','방문자수','전년 대비'],ys.map(y=>{const p=d.annualVisits[y-1],v=d.annualVisits[y];return [y+'년',fmt(v),p?`${v>=p?'+':''}${((v/p-1)*100).toFixed(1)}%`:'–']}))}</div></div>${subhead('1.2','일자별 방문자 비교','행사 시작일을 D1로 맞춰 행사기간이 다른 연도도 같은 순번으로 비교합니다.')}<div class="card">${lineChart(dailyCats,dailySeries)}</div>${table(['행사일',...ys.map(y=>y+'년 일자·요일·방문자')],dailyRows)}${subhead('1.3','요일별 방문자 비교','같은 요일이 여러 번 있으면 해당 요일 방문자수를 합산합니다.')}<div class="card">${groupedChart(WEEK,weekdaySeries)}</div>`)}
function section2(d,ys){const vals=ys.map(y=>d.foreignAnnual[y]||0),cats=[...new Set(ys.flatMap(y=>(d.foreignCategories[y]||[]).map(x=>x.label)))],segments=cats.map(c=>({name:foreignLabel(c),color:FOREIGN_COLORS[c]||'#6F55A5',values:ys.map(y=>rowMap(d.foreignCategories[y])[c]?.value||0)}));const rows=[];ys.forEach(y=>(d.foreignCategories[y]||[]).forEach(x=>rows.push([y+'년',esc(foreignLabel(x.label)),fmt(x.value),pct(share(x.value,d.foreignAnnual[y]))])));return page('section2','2','외국인 방문자 비교','내국인은 제외하고 장기체류 외국인과 단기체류 외국인을 비교합니다.',`<div class="grid2"><div class="card"><h4>연도별 외국인 방문자수</h4>${groupedChart(['외국인 방문자'],ys.map((y,i)=>({name:y+'년',color:yearColor(y),values:[vals[i]]})))}</div><div class="card"><h4>외국인 유형 구성비</h4>${stacked100(ys.map(String),segments)}</div></div>${table(['연도','외국인 구분','방문자수','구성비'],rows)}<div class="note">연도 색상: 2024년 파랑, 2025년 주황, 2026년 분홍. 유형 색상: 장기체류 외국인 청록, 단기체류 외국인 황금색.</div><div class="warn">원천에는 국가명이 없어 국가별 비교는 제공하지 않습니다.</div>`) }
function section3(d,ys){const genderSeg=['F','M'].map((g,i)=>({name:g==='F'?'여성':'남성',color:g==='F'?'#ED3B9A':'#176B8C',values:ys.map(y=>rowMap(d.demographics[y]?.gender)[g]?.value||0)}));const ageSeries=ys.map((y,i)=>({name:y+'년',color:yearColor(y),values:AGE.map(a=>rowMap(d.demographics[y]?.age)[a]?.share||0)}));const dy=d.dailyDemographics['2026']||{},dates=Object.keys(dy),weekend=dates.map(x=>[0,6].includes(new Date(x+'T00:00:00').getDay())),dailySeries=AGE.map((a,i)=>({name:a,color:C[i%C.length],values:dates.map(dt=>rowMap(dy[dt].age)[a]?.share||0)}));return page('section3','3','성·연령별 비교','DB1 내국인 중 성별·연령 값이 있는 방문자를 기준으로 비교합니다.',`${subhead('3.1','연도별×성별 비교')}<div class="card">${stacked100(ys.map(String),genderSeg)}</div>${subhead('3.2','연도별×연령별 비교')}<div class="card">${hGrouped(AGE,ageSeries,{percent:true})}</div>${subhead('3.3','연도별×성×연령별 비교','남성은 왼쪽, 여성은 오른쪽에 배치하고 연도별 고정 색상으로 한 그래프에서 비교합니다.')}<div class="pyramid-grid">${genderAgePyramid(d,ys)}</div>${subhead('3.4','26년 일자별×연령별 비교','점선 배경은 주말입니다. 막대를 선택하면 같은 연령대의 모든 일자 막대가 함께 강조됩니다.')}<div class="card">${groupedChart(dates.map(x=>x.slice(5)),dailySeries,{percent:true,max:Math.max(35,...dailySeries.flatMap(x=>x.values)),weekend})}</div>`) }
function mergeKidsmom(arr){const out={};(arr||[]).forEach(x=>{const k=x.label.startsWith('키즈맘')?'키즈맘':x.label;out[k]=(out[k]||0)+x.value});return Object.entries(out).map(([label,value])=>({label,value,share:share(value,sum(Object.values(out)))}))}
function householdDetailGroup(label){if(label==='1인가구'||label==='2인가구'||label==='중년_자녀동거_자녀')return '청년';if(label.startsWith('키즈맘'))return '키즈맘';if(label==='중년_1인'||label==='중년_2인'||label==='중년_자녀동거_중년')return '중년';if(label==='시니어')return '시니어';return '기타'}
function householdDetailOrder(labels){const order=['청년','키즈맘','중년','시니어','기타'];return [...labels].sort((a,b)=>{const ga=order.indexOf(householdDetailGroup(a)),gb=order.indexOf(householdDetailGroup(b));return ga-gb||a.localeCompare(b,'ko')})}
function section4(d,ys){const mergedAnnual=Object.fromEntries(ys.map(y=>[y,mergeKidsmom(d.householdAnnual[y])])),simpleCats=['청년','키즈맘','중년','시니어'].filter(c=>ys.some(y=>rowMap(mergedAnnual[y])[c])),simpleAnnual=ys.map(y=>({name:y+'년',color:yearColor(y),values:simpleCats.map(c=>rowMap(mergedAnnual[y])[c]?.share||0)}));const detailGetter=y=>d.householdOriginalAnnual[y]||[],detailCats=householdDetailOrder([...new Set(ys.flatMap(y=>detailGetter(y).map(x=>x.label)))]),detailAnnual=ys.map(y=>({name:y+'년',color:yearColor(y),values:detailCats.map(c=>rowMap(detailGetter(y))[c]?.share||0)}));const wp=d.householdWeekpart['2026']||{},mergedWp={주중:mergeKidsmom(wp['주중']),주말:mergeKidsmom(wp['주말'])},simpleWp=['주중','주말'].map((w,i)=>({name:w,color:i?C[0]:C[1],values:simpleCats.map(c=>rowMap(mergedWp[w])[c]?.share||0)}));const detailWp=d.householdOriginalWeekpart['2026']||{},detailWpCats=householdDetailOrder([...new Set(['주중','주말'].flatMap(w=>(detailWp[w]||[]).map(x=>x.label)))]),detailWpSeries=['주중','주말'].map((w,i)=>({name:w,color:i?C[0]:C[1],values:detailWpCats.map(c=>rowMap(detailWp[w])[c]?.share||0)}));const rawCats=[...new Set(['주중','주말'].flatMap(w=>(wp[w]||[]).filter(x=>x.label.startsWith('키즈맘')).map(x=>x.label)))],kidSeries=['주중','주말'].map((w,i)=>{const ar=(wp[w]||[]).filter(x=>x.label.startsWith('키즈맘')),total=sum(ar.map(x=>x.value));return {name:w,color:i?C[0]:C[1],values:rawCats.map(c=>share(rowMap(ar)[c]?.value||0,total))}});const btn1=`<button class="view-toggle" onclick="togglePair('hhAnnualSimple','hhAnnualDetail',this)">상세보기</button>`,btn2=`<button class="view-toggle" onclick="togglePair('hhWeekSimple','hhWeekDetail',this)">상세보기</button>`;return page('section4','4','가구유형별 비교','기본은 청년·키즈맘·중년·시니어 4개 유형이며, 상세보기에서는 청년 → 키즈맘 → 중년 → 시니어 순으로, 각 그룹 안에서는 가나다순으로 원천 가구 세그먼트를 표시합니다.',`${subhead('4.1','연도별×가구유형별 비교','상세보기는 청년 → 키즈맘 → 중년 → 시니어 순이며 그룹 내 가나다순입니다.',btn1)}<div id="hhAnnualSimple" class="view-block card">${hGrouped(simpleCats,simpleAnnual,{percent:true})}</div><div id="hhAnnualDetail" class="view-block card hidden">${hGrouped(detailCats,detailAnnual,{percent:true})}</div>${subhead('4.2','26년 주중/주말×가구유형별 비교','상세보기는 청년 → 키즈맘 → 중년 → 시니어 순이며 그룹 내 가나다순입니다.',btn2)}<div id="hhWeekSimple" class="view-block card">${hGrouped(simpleCats,simpleWp,{percent:true})}</div><div id="hhWeekDetail" class="view-block card hidden">${hGrouped(detailWpCats,detailWpSeries,{percent:true})}</div>${subhead('4.3','26년 주중/주말×키즈맘 유형별 비교','키즈맘 내부의 초등·중등·미취학 세부 구성을 비교합니다.')}<div class="card">${hGrouped(rawCats,kidSeries,{percent:true,max:100})}</div>`) }
function exclusionNote(d,type,ys){const x=d.locationRuleV12,hp=x.hostProvince,hd=x.hostDistrict;if(type==='residence'){const z=ys.map(y=>`${y}년 ${fmt(x.residenceAudit[y]?.excludedValue||0)}명`).join(' · ');return `<div class="exclusion-note"><b>개최지역 제외 기준</b>개최시도: ${esc(hp)} · 개최 시군구: ${esc(hd)} · 행정단위: ${esc(x.administrativeType)}<br>${esc(x.residenceMode)} 규칙을 적용했습니다. 실제 제외 규모: ${z}.</div>`}const z=ys.map(y=>`${y}년 ${fmt(x.lodgingAudit[y]?.excludedValue||0)}명·일`).join(' · ');if(!x.lodgingDistrictAvailable&&x.administrativeType==='도단위')return `<div class="exclusion-note"><b>숙박 개최지역 제외 기준</b>개최시도: ${esc(hp)} · 개최 시군구: ${esc(hd)}<br>도 단위 개최지는 개최 시군구만 제외해야 하지만 숙박 원천에는 시군구 열이 없어 정확한 제외가 불가능합니다. 임의 추정이나 ${esc(hp)} 전체 제외를 하지 않고 원천 숙박값을 유지했습니다.</div>`;return `<div class="exclusion-note"><b>숙박 개최지역 제외 기준</b>개최시도: ${esc(hp)} · 개최 시군구: ${esc(hd)}<br>${esc(x.lodgingMode)} 규칙을 적용했습니다. 실제 제외 규모: ${z}.</div>`}

async function loadExternalExcelFromDataDir(){
  const reportEl = document.getElementById('report');
  if (reportEl) {
    reportEl.innerHTML = '<section class="page" style="display:grid;place-items:center;min-height:360px;text-align:center;"><div><h3>./data 폴더의 엑셀 데이터를 불러오는 중입니다...</h3><p class="lead">manifest.json 및 각 축제별 .xlsx 원천 시트를 실시간으로 파싱하고 있습니다.</p></div></section>';
  }
  try {
    const res = await fetch('./data/manifest.json?t=' + Date.now());
    if (!res.ok) throw new Error('manifest.json 파일을 찾을 수 없습니다 (HTTP ' + res.status + ')');
    const manifest = await res.json();
    const entries = Array.isArray(manifest.files) ? manifest.files : [];

    for (const item of entries) {
      const fileName = typeof item === 'string' ? item : item.file;
      if (!fileName) continue;
      const fileUrl = './data/' + encodeURIComponent(fileName);
      const xRes = await fetch(fileUrl + '?t=' + Date.now());
      if (!xRes.ok) {
        console.warn('엑셀 파일 로드 실패:', fileName, xRes.status);
        continue;
      }
      const buf = await xRes.arrayBuffer();
      const pseudoFile = {
        name: fileName,
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        arrayBuffer: async () => buf
      };
      const sheets = await readWorkbook(pseudoFile);
      const festObj = buildFestivalFromWorkbook(sheets, pseudoFile);
      if (item && item.id) festObj.id = item.id;
      if (item && item.name) festObj.name = item.name;
      festObj.sourceFile = fileName;
      festObj._dataUrl = fileUrl;
      festObj._rawSheets = sheets;
      festObj._uploaded = false;

      SOURCE_DB[festObj.id] = {
        id: festObj.id,
        name: festObj.name,
        sourceFile: fileName,
        sheets: sheets
      };
      DATA.festivals[festObj.id] = festObj;
      BUILTIN_FESTIVALS[festObj.id] = JSON.parse(JSON.stringify(festObj));
      if (!BUILTIN_ORDER.includes(festObj.id)) BUILTIN_ORDER.push(festObj.id);
      if (!festivalOrder.includes(festObj.id)) festivalOrder.push(festObj.id);
    }
  } catch (err) {
    console.error('외부 Excel 로드 오류:', err);
    if (reportEl && !Object.keys(DATA.festivals).length) {
      reportEl.innerHTML = `<section class="page"><div class="warn"><b>외부 ./data 폴더의 엑셀 파일을 불러오지 못했습니다.</b><br>사유: ${esc(err.message)}<br><br>※ 로컬 PC에서 <code>file://</code> 경로로 직접 열면 브라우저 보안(CORS) 정책상 하위 폴더 <code>./data/*.xlsx</code> 읽기가 차단될 수 있습니다.<br><b>GitHub Pages</b>에 업로드하거나, 로컬에서는 <code>python -m http.server 8000</code> 실행 후 <code>http://localhost:8000</code>으로 접속해 주세요.</div></section>`;
      return false;
    }
  }
  return true;
}

// 신규 엑셀/CSV 업로드 시 ./data/축제명_저장일자.xlsx 파일 자동 다운로드 및 manifest.json 안내 지원
function triggerExcelDownloadForDataDir(festObj, originalFile) {
  const today = new Date();
  const ymd = today.getFullYear() + String(today.getMonth()+1).padStart(2,'0') + String(today.getDate()).padStart(2,'0');
  const safeName = String(festObj.name || '신규축제').replace(/[\\/*?:"<>|]/g, '_').trim();
  const targetFilename = `${safeName}_${ymd}.xlsx`;

  if (originalFile && /\.xlsx$/i.test(originalFile.name)) {
    const url = URL.createObjectURL(originalFile);
    const a = document.createElement('a');
    a.href = url;
    a.download = targetFilename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } else if (festObj._rawSheets) {
    // CSV 6개 업로드 시에도 SpreadsheetML/Excel 파일로 저장 가능하도록 제공
    const rec = { name: festObj.name, sourceFile: targetFilename, sheets: festObj._rawSheets };
    SOURCE_DB[festObj.id] = rec;
    const src = sourceDbDataFile(festObj.id);
    if (src) {
      const a = document.createElement('a');
      a.href = src.url;
      a.download = targetFilename.replace(/\.xlsx$/i, '.xls');
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  }
  return targetFilename;
}
